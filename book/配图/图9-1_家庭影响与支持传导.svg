<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc">
<title id="title">家庭影响与支持传导</title><desc id="desc">两个独立虚构情境：已依赖的住房支持撤回，可以在本人反对时改变条件；明确自愿的短期照护实际完成，可以减少负担并释放协作余力。两例均不是沈宁与梁川已经发生的经历。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="980" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="52" class="title">家庭影响能够直接进入生活，也能提供真实缓冲</text>
<text x="38" y="92" class="body">两个独立虚构情境，不是沈宁与梁川已经发生的事件。</text>
<rect x="38" y="135" width="510" height="160" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="176" class="title">A · 已经依赖的住房支持</text>
<text x="60" y="217" class="body">支持原已确认并进入生活安排</text>
<text x="60" y="250" class="body">当前住房选择与这项资源相连接</text>
<rect x="572" y="135" width="510" height="160" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="594" y="176" class="title">B · 收入下降后的照护需要</text>
<text x="594" y="217" class="body">原付费安排难继续；父亲自愿提出</text>
<text x="594" y="250" class="body">在约定的两周时段内协助接送</text>
<path class="line" d="M293,302 V327"/><path class="line" d="M827,302 V327"/>
<rect x="38" y="340" width="510" height="160" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="60" y="381" class="title">支持者后来撤回</text>
<text x="60" y="422" class="body">本人反对也不能使资源自动恢复</text>
<text x="60" y="455" class="body">可用住房条件与资金缺口已改变</text>
<rect x="572" y="340" width="510" height="160" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="594" y="381" class="title">支持按约定实际到位</text>
<text x="594" y="422" class="body">本人有能力、各方时间能匹配</text>
<text x="594" y="455" class="body">其他时段仍由夫妻承担</text>
<path class="line" d="M293,508 V533"/><path class="line" d="M827,508 V533"/>
<rect x="38" y="546" width="510" height="160" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="587" class="title">共同安排需要重新处理</text>
<text x="60" y="628" class="body">更新可用条件与选择，明确实际缺口</text>
<text x="60" y="661" class="body">不能只要求伴侣再表态一次独立</text>
<rect x="572" y="546" width="510" height="160" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="594" y="587" class="title">奔波减少，协作余力出现</text>
<text x="594" y="628" class="body">省出的时间用于休息与讨论下一步</text>
<text x="594" y="661" class="body">不自动延长支持，也不转交全部决定</text>
<rect x="38" y="754" width="1044" height="154" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="60" y="795" class="title">看传导是否真正发生</text>
<text x="60" y="836" class="body">帮助是否真实可用、收益是否回到承担者、条件变化后能否重谈，分别核对。</text>
<text x="60" y="869" class="body">边界可以调节部分连接，不能隔绝全部外部约束；支持也不购买无限治理权。</text>
<text x="38" y="953" class="small">图9-1 · 风险、相处兼容、积极生成与危机缓冲分别观察，不能互相抵销。</text>
</svg>