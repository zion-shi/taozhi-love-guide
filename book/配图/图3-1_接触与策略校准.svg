<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
<title id="title">从可见到持续生成：不同判断需要不同依据</title>
<desc id="desc">四处观察分别是可见、可接触、双向选择与持续生成。真实互动提供新事实，再决定继续、调整休息或不再推进；不是必经流水线或已知概率模型，身份和重大行动另行确认。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="780" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.small{font-size:16px}.body{font-size:18px}.title{font-size:25px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="52" font-size="29" font-weight="600">接触产生新事实，事实帮助调整下一步</text>
<text x="38" y="88" class="body">每一项分别看依据；任何位置都可以停下，不是已知概率的转化漏斗。</text>
<rect x="38" y="125" width="240" height="192" rx="16" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="58" y="167" class="title">可见</text>
<text x="58" y="210" class="body">看到资料或具体的人</text>
<text x="58" y="241" class="body">不等于有认识机会</text>
<text x="58" y="285" class="small">缺口：地域、时间、意愿</text>
<path class="line" d="M281,220 H301"/>
<path d="M158,320 V347" fill="none" stroke="#50746b" stroke-width="2"/>
<rect x="306" y="125" width="240" height="192" rx="16" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="326" y="167" class="title">可接触</text>
<text x="326" y="210" class="body">双方有自愿接触机会</text>
<text x="326" y="241" class="body">不等于彼此感兴趣</text>
<text x="326" y="285" class="small">缺口：真实体验与回应</text>
<path class="line" d="M549,220 H569"/>
<path d="M426,320 V347" fill="none" stroke="#50746b" stroke-width="2"/>
<rect x="574" y="125" width="240" height="192" rx="16" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="594" y="167" class="title">双向选择</text>
<text x="594" y="210" class="body">双方愿意继续了解</text>
<text x="594" y="241" class="body">不等于已经是恋人</text>
<text x="594" y="285" class="small">缺口：持续参与与约定</text>
<path class="line" d="M817,220 H837"/>
<path d="M694,320 V347" fill="none" stroke="#50746b" stroke-width="2"/>
<rect x="842" y="125" width="240" height="192" rx="16" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="862" y="167" class="title">持续生成</text>
<text x="862" y="210" class="body">共同参与带来新体验</text>
<text x="862" y="241" class="body">并据结果更新理解</text>
<text x="862" y="285" class="small">仍需：身份与行动判断</text>
<path d="M962,320 V347" fill="none" stroke="#50746b" stroke-width="2"/>
<path d="M158,347 H962" fill="none" stroke="#50746b" stroke-width="2"/>
<path class="line" d="M560,347 V370"/>
<rect x="38" y="379" width="1044" height="134" rx="16" fill="#fffdf8" stroke="#c8d3cb"/>
<text x="62" y="418" class="title">把实际结果带回当前选择</text>
<text x="62" y="452" class="body">看到了什么新事实？双方是否参与？哪项偏好需修订，哪项重要条件仍未知？</text>
<text x="62" y="485" class="body">只改变眼下能处理的一两项；没有新信息，不靠反复记录制造进展。</text>
<path d="M560,516 V535 M204,535 H916" fill="none" stroke="#50746b" stroke-width="2"/>
<path class="line" d="M204,535 V552"/><path class="line" d="M560,535 V552"/><path class="line" d="M916,535 V552"/>
<rect x="38" y="562" width="332" height="124" rx="14" fill="#eef0e7"/>
<text x="60" y="597" class="title">继续接触</text><text x="60" y="631" class="body">增加可承担的真实参与</text><text x="60" y="661" class="body">根据新经历再看下一步</text>
<rect x="394" y="562" width="332" height="124" rx="14" fill="#eef0e7"/>
<text x="416" y="597" class="title">调整或休息</text><text x="416" y="631" class="body">改变渠道、形式或负荷</text><text x="416" y="661" class="body">已有约定仍需妥善处理</text>
<rect x="750" y="562" width="332" height="124" rx="14" fill="#eef0e7"/>
<text x="772" y="597" class="title">不再推进</text><text x="772" y="631" class="body">尊重自己的选择与拒绝</text><text x="772" y="661" class="body">不必证明某个人有恶意</text>
<text x="38" y="731" class="body">注意力收敛不自动形成排他；身份确定也不自动许可身体接触或重大绑定。</text>
<text x="38" y="759" class="small">图3-1 · 本书的过程观察图；箭头表示需要补充的依据，不保证关系会继续。</text></svg>