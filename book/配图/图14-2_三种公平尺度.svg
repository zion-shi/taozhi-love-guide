<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1040" viewBox="0 0 1120 1040" role="img" aria-labelledby="title desc">
<title id="title">三种公平尺度</title><desc id="desc">领域、整体和生命周期观察同一安排的不同方面，不能相加打分；贡献需要回应真实需要，变化后责任重新认领，实际运行再回看。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="1040" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="50" class="title">三种尺度，共同检视一项安排</text>
<rect x="38" y="90" width="1044" height="112" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="131" class="title">原来认可的分工</text>
<text x="60" y="172" class="body">条件改变后，要看原来的支持是否还保护双方的重要需要。</text>
<rect x="38" y="259" width="334" height="205" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="300" class="title">领域</text>
<text x="60" y="341" class="body">这项任务谁做全程？</text>
<text x="60" y="374" class="body">谁还在提醒和补漏？</text>
<text x="60" y="407" class="body">权限是否够用？</text>
<rect x="393" y="259" width="334" height="205" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="415" y="300" class="title">整体</text>
<text x="415" y="341" class="body">各自总负荷怎样？</text>
<text x="415" y="374" class="body">休息、自主是否可用？</text>
<text x="415" y="407" class="body">风险与收益怎样分布？</text>
<rect x="748" y="259" width="334" height="205" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="770" y="300" class="title">生命周期</text>
<text x="770" y="341" class="body">当前支持谁的需要？</text>
<text x="770" y="374" class="body">未来机会有什么路径？</text>
<text x="770" y="407" class="body">已兑现什么，何时重议？</text>
<path class="line" d="M560,202 V229 H205 V257"/>
<path class="line" d="M560,202 V229 H560 V257"/>
<path class="line" d="M560,202 V229 H915 V257"/>
<rect x="100" y="530" width="920" height="144" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="122" y="571" class="title">贡献是否回应了对方实际需要？</text>
<text x="122" y="612" class="body">较高收入、家务劳动都可以有价值；多存钱不会自动还回学习时间。</text>
<text x="122" y="645" class="body">不能用一处优势无限抵销另一项本人不接受的核心损失。</text>
<path class="line" d="M205,464 V497 H560 V528"/>
<path class="line" d="M560,464 V497 H560 V528"/>
<path class="line" d="M915,464 V497 H560 V528"/>
<rect x="100" y="728" width="920" height="177" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="122" y="769" class="title">具体调整，并看实际结果</text>
<text x="122" y="810" class="body">界定事务 → 认领 → 履行 → 贡献回应 → 变化与重分配</text>
<text x="122" y="843" class="body">例：取消一项非必要整理，重分配两次采购，学习时段实际得以使用。</text>
<text x="122" y="876" class="body">这只支持当前改善；长期可持续性仍要结合后续事实。</text>
<path class="line" d="M560,674 V726"/>
<path class="line" d="M1020,815 H1102 V147 H1084"/>
<text x="40" y="973" class="small">图14-2｜三种尺度相互校正，不是三项分数，也不要求每件事各做一半。</text>
</svg>