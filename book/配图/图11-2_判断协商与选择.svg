<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="965" viewBox="0 0 1120 965" role="img" aria-labelledby="title desc">
<title id="title">判断协商与选择</title><desc id="desc">静态相容现实可行动态运行共同为综合判断和关键协商提供依据。判断和协商双向校验，得到推进暂缓或不推进的当前选择。适婚判断同意结婚正式婚约及实际实施分别记录，重大变化可返回受影响条件。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="965" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="51" class="title">关键协商会改变判断，判断也指明该谈什么</text>
<rect x="38" y="90" width="320" height="165" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="131" class="title">静态：是否可共存</text>
<text x="60" y="172" class="body">意愿、底线与重要需要</text>
<text x="60" y="205" class="body">不预支对方未认可的改变</text>
<rect x="400" y="90" width="320" height="165" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="422" y="131" class="title">现实：路径是否可行</text>
<text x="422" y="172" class="body">资源、义务、时间与权限</text>
<text x="422" y="205" class="body">决定性未知不能当已满足</text>
<rect x="762" y="90" width="320" height="165" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="784" y="131" class="title">动态：已经怎样运行</text>
<text x="784" y="172" class="body">亲密、合作、修复、支持</text>
<text x="784" y="205" class="body">不靠人为危机增加证据</text>
<path d="M198,263 V298 H922 V263 M560,263 V298" fill="none" stroke="#50746b" stroke-width="2"/><path class="line" d="M293,298 V332"/><path class="line" d="M827,298 V332"/>
<rect x="38" y="345" width="510" height="170" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="386" class="title">综合判断</text>
<text x="60" y="427" class="body">现有依据支持到什么范围</text>
<text x="60" y="460" class="body">重要前提未定时明确保留</text>
<rect x="572" y="345" width="510" height="170" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="594" y="386" class="title">关键协商</text>
<text x="594" y="427" class="body">事实、意愿与具体安排能否对齐</text>
<text x="594" y="460" class="body">谈不拢或条件变化就返回重看</text>
<path class="line" d="M553,412 H566"/><path class="line" d="M567,446 H554"/>
<path d="M293,523 V551 H827 V523 M198,551 H922" fill="none" stroke="#50746b" stroke-width="2"/><path class="line" d="M198,551 V577"/><path class="line" d="M560,551 V577"/><path class="line" d="M922,551 V577"/>
<rect x="38" y="590" width="320" height="185" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="631" class="title">推进</text>
<text x="60" y="672" class="body">前提有依据、本人仍愿意</text>
<text x="60" y="705" class="body">说明具体推进哪项决定</text>
<text x="60" y="738" class="body">不自动完成正式婚约</text>
<rect x="400" y="590" width="320" height="185" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="422" y="631" class="title">暂缓</text>
<text x="422" y="672" class="body">缺什么、谁处理、何时需明确</text>
<text x="422" y="705" class="body">日常相处与去留另作选择</text>
<text x="422" y="738" class="body">不以等待代替可行路径</text>
<rect x="762" y="590" width="320" height="185" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="784" y="631" class="title">不推进</text>
<text x="784" y="672" class="body">无可接受路径或本人不愿</text>
<text x="784" y="705" class="body">不必证明对方有错</text>
<text x="784" y="738" class="body">真实善后另外处理</text>
<text x="38" y="822" class="body">适婚判断、同意结婚、正式婚约与实际实施分别记录；未来重大变化仍可重看。</text>
<text x="38" y="861" class="body">必要家庭告知不等于父母审批；身体、购房、生育等行动始终需要独立决定。</text>
<text x="38" y="920" class="small">图11-2 · 当前选择没有统一总分、月数或成功概率；不以填表顺序视为已经通过。</text>
</svg>