<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">吸引的体验与后续选择分别判断</title>
<desc id="desc">注意、喜欢、欣赏、欲望与亲密期待可以交织，不是五级阶梯。继续认识、共同身份与具体行动分别需要双方意愿、实际运行或当前同意及条件。新信息可以修正感受，身份不能代替具体许可。</desc>
<rect width="1120" height="850" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.cardtitle{font-size:24px;font-weight:600}</style>
<text x="38" y="53" font-size="29" font-weight="600">有吸引，之后仍有不同的选择</text>
<text x="38" y="90" class="body">五种体验可以交织，也可以只有某一部分；不按固定顺序增加。</text>
<rect x="38" y="126" width="196" height="158" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="56" y="169" class="cardtitle">注意</text><text x="56" y="214" class="small">某个特点使我停留</text><text x="56" y="245" class="small">想知道更多</text>
<rect x="250" y="126" width="196" height="158" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="268" y="169" class="cardtitle">喜欢</text><text x="268" y="214" class="small">我享受这次相处</text><text x="268" y="245" class="small">愿意继续交流</text>
<rect x="462" y="126" width="196" height="158" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="480" y="169" class="cardtitle">欣赏</text><text x="480" y="214" class="small">我认可某种能力</text><text x="480" y="245" class="small">或具体做事方式</text>
<rect x="674" y="126" width="196" height="158" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="692" y="169" class="cardtitle">欲望</text><text x="692" y="214" class="small">我有身体靠近</text><text x="692" y="245" class="small">这个人的冲动</text>
<rect x="886" y="126" width="196" height="158" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="904" y="169" class="cardtitle">亲密期待</text><text x="904" y="214" class="small">我想被理解</text><text x="904" y="245" class="small">也想分享彼此日常</text>
<rect x="38" y="316" width="1044" height="87" rx="14" fill="#fffdf8" stroke="#c8d3cb"/>
<text x="60" y="350" class="body">新接触补充信息，感受可以增强、减弱或变得更清楚。</text>
<text x="60" y="382" class="body">任何一种体验，都不能独自回答下面三个问题。</text>
<text x="38" y="452" font-size="24" font-weight="600">下一步分别问</text>
<rect x="38" y="479" width="332" height="196" rx="15" fill="#eef0e7"/>
<text x="58" y="521" class="cardtitle">是否继续认识</text>
<text x="58" y="565" class="body">双方都愿意再接触吗？</text>
<text x="58" y="599" class="body">还有什么想了解或共同体验？</text>
<text x="58" y="633" class="body">可以继续，也可以停止。</text>
<rect x="394" y="479" width="332" height="196" rx="15" fill="#eef0e7"/>
<text x="414" y="521" class="cardtitle">是否确认共同身份</text>
<text x="414" y="565" class="body">双方是否明确作出约定？</text>
<text x="414" y="599" class="body">实际运行支持什么节点？</text>
<text x="414" y="633" class="body">一次心动不会自动产生身份。</text>
<rect x="750" y="479" width="332" height="196" rx="15" fill="#eef0e7"/>
<text x="770" y="521" class="cardtitle">是否进行具体行动</text>
<text x="770" y="565" class="body">当前同意与实际条件具备吗？</text>
<text x="770" y="599" class="body">费用、身体与重大安排分别看。</text>
<text x="770" y="633" class="body">身份不能代替具体许可。</text>
<text x="38" y="724" class="body">吸引强度、长期生活价值、稳定性分别看，不合成统一分数。</text>
<text x="38" y="761" class="body">未被确认的部分保留未知；明确拒绝按其范围处理；实际侵害优先保护。</text>
<text x="38" y="812" class="small">图4-1 · 本书的概念区分图；不是必经流程，也不是关系成功预测工具。</text></svg>