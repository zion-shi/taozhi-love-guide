<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
<title id="title">感情初步自持：可承担的参与与积极价值</title><desc id="desc">普通参与带来双方认可的积极体验，支持继续参与和回应，形成可持续的感情过程。负担必须可承担；平静、频繁联系和昂贵刺激都不能单独证明自持，正式身份与具体行动另行决定。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="840" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="53" font-size="29" font-weight="600">相处本身有价值，双方也愿意继续参与</text>
<text x="38" y="90" class="body">感情初步自持：依靠普通、可承担的投入，持续形成双方认可的积极价值。</text>
<rect x="38" y="130" width="320" height="175" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="171" class="title">普通参与</text>
<text x="60" y="212" class="body">愿意分享、倾听、见面</text>
<text x="60" y="245" class="body">不必每次制造惊喜</text>
<text x="60" y="278" class="body">双方都以现实方式参与</text>
<rect x="400" y="130" width="320" height="175" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="422" y="171" class="title">积极体验</text>
<text x="422" y="212" class="body">被理解、欣赏和关心</text>
<text x="422" y="245" class="body">相处后仍想再次靠近</text>
<text x="422" y="278" class="body">不只是完成联系任务</text>
<rect x="762" y="130" width="320" height="175" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="784" y="171" class="title">继续参与与回应</text>
<text x="784" y="212" class="body">双方愿继续投入时间</text>
<text x="784" y="245" class="body">从具体回应中增加信任</text>
<text x="784" y="278" class="body">为下一次相处留下空间</text>
<path class="line" d="M362,218 H392"/><path class="line" d="M724,218 H754"/><path class="line" d="M922,311 V352 H198 V312"/>
<text x="285" y="382" class="small">有相应价值与意愿时，支持下一轮普通参与；不是必然发生的循环。</text>
<rect x="38" y="416" width="1044" height="135" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="457" class="title">这个过程要有可承担的负担</text>
<text x="60" y="498" class="body">时间、精力、经济和情绪投入不依赖持续透支；自然忙碌后，可以说明、调整和重新连接。</text>
<text x="60" y="531" class="body">一次恢复支持当前判断，不证明今后所有压力下都能恢复，也不需要人为制造考验。</text>
<rect x="38" y="582" width="320" height="138" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="60" y="623" class="title">频率不等于价值</text>
<text x="60" y="664" class="body">常联系但没有积极体验</text>
<text x="60" y="697" class="body">仍可能只在履行任务</text>
<rect x="400" y="582" width="320" height="138" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="422" y="623" class="title">平静不等于健康</text>
<text x="422" y="664" class="body">若靠压抑需要维持平静</text>
<text x="422" y="697" class="body">不能据此认定自持</text>
<rect x="762" y="582" width="320" height="138" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="784" y="623" class="title">刺激不等于持续</text>
<text x="784" y="664" class="body">昂贵活动可以愉快</text>
<text x="784" y="697" class="body">普通相处仍需实际了解</text>
<text x="38" y="748" class="body">初步自持支持恋爱判断，但不替代双方意愿、必要事实及重要方向；具体行动独立决定。</text>
<text x="38" y="803" class="small">图6-1 · 本书的条件性观察框架，不是量表、统一时长门槛或关系升级证书。</text>
</svg>