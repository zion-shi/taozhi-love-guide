<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc">
<title id="title">投入被误读为权利后的索取循环</title><desc id="desc">将付出误读为已取得权利，回应不如预期后继续加码，期待和索取增强。需要分别纠正投入与身份混同，诚实表达意愿，尊重拒绝；实际强迫或威胁优先保护，不平均归责。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="830" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="53" font-size="29" font-weight="600">当投入被误读为权利</text>
<text x="38" y="90" class="body">这是需要事实支持的条件路径，不表示所有礼物、期待或失望都会如此发展。</text>
<rect x="38" y="130" width="320" height="172" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="171" class="title">先把付出当成权利</text>
<text x="60" y="212" class="body">“我已经做了这么多”</text>
<text x="60" y="245" class="body">被理解成对方已欠下</text>
<text x="60" y="278" class="body">感情、身份或身体回报</text>
<rect x="400" y="130" width="320" height="172" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="422" y="171" class="title">回应未如预期</text>
<text x="422" y="212" class="body">用更大的投入改变结果</text>
<text x="422" y="245" class="body">成本与期待继续增加</text>
<text x="422" y="278" class="body">却仍未获得真实同意</text>
<rect x="762" y="130" width="320" height="172" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="784" y="171" class="title">期待转成更强索取</text>
<text x="784" y="212" class="body">责备、施压或越过拒绝</text>
<text x="784" y="245" class="body">勉强配合又可能被误读</text>
<text x="784" y="278" class="body">为接受了交换与身份</text>
<path class="line" d="M362,216 H392"/><path class="line" d="M724,216 H754"/><path class="line" d="M922,307 V349 H198 V309"/>
<text x="38" y="393" class="body">辨认行为及其后果，不把“存在循环”理解成双方同责。</text>
<rect x="38" y="430" width="320" height="181" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="471" class="title">付出者可以调整</text>
<text x="60" y="512" class="body">承认哪些期待未获同意</text>
<text x="60" y="545" class="body">把投入缩到真实可承担</text>
<text x="60" y="578" class="body">不拿更大成本继续索取</text>
<rect x="400" y="430" width="320" height="181" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="422" y="471" class="title">意愿需要诚实表达</text>
<text x="422" y="512" class="body">愿意、不愿意或尚未确定</text>
<text x="422" y="545" class="body">分别说清，不许虚假未来</text>
<text x="422" y="578" class="body">也不将犹豫直接判作利用</text>
<rect x="762" y="430" width="320" height="181" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="784" y="471" class="title">拒绝仍然有效</text>
<text x="784" y="512" class="body">财物问题与身份分别处理</text>
<text x="784" y="545" class="body">不以身体偿还礼物或照顾</text>
<text x="784" y="578" class="body">受影响者可停止、获得支持</text>
<text x="38" y="658" class="body">若已出现强迫、威胁或限制自由：优先保护，不以完成共同修复为前提。</text>
<text x="38" y="696" class="body">还钱或道歉不自动恢复尊重、信任与选择空间；具体行为分别承担责任。</text>
<text x="38" y="784" class="small">图5-2 · 用于识别和阻断误读与索取，不是诱导回应的方法，也不是责任比例图。</text>
</svg>