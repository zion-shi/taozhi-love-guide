<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">负荷与亲密生成</title><desc id="desc">真实减负为合适互动提供空间，适当回应与积极体验可能形成强化循环；过程需要真实意愿和可承担条件，减负不保证爱情。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="900" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="51" class="title">让连接有发生空间，再看它是否真的带来价值</text>
<text x="38" y="92" class="body">下面是有条件的作用路径，不是照做便成功的程序。</text>
<rect x="38" y="140" width="246" height="210" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="181" class="title">实际减负</text>
<text x="60" y="222" class="body">取消非必要标准</text>
<text x="60" y="255" class="body">完整认领任务</text>
<text x="60" y="288" class="body">执行者有权限</text>
<rect x="304" y="140" width="246" height="210" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="326" y="181" class="title">可参与空间</text>
<text x="326" y="222" class="body">本人确实能休息</text>
<text x="326" y="255" class="body">没有暗中补回任务</text>
<text x="326" y="288" class="body">也允许想独处</text>
<rect x="570" y="140" width="246" height="210" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="592" y="181" class="title">适当表达与回应</text>
<text x="592" y="222" class="body">方式符合双方意愿</text>
<text x="592" y="255" class="body">既能分享也能倾听</text>
<text x="592" y="288" class="body">拒绝可以被接受</text>
<rect x="836" y="140" width="246" height="210" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="858" y="181" class="title">积极体验与主动</text>
<text x="858" y="222" class="body">本人觉得相处有价值</text>
<text x="858" y="255" class="body">后来愿意主动靠近</text>
<text x="858" y="288" class="body">仍看双方真实反馈</text>
<path class="line" d="M288,245 H296"/>
<path class="line" d="M554,245 H562"/>
<path class="line" d="M820,245 H828"/>
<path class="line" d="M959,358 V405 H693 V360"/>
<text x="540" y="443" class="small">有价值的体验，可增加下一次主动表达的机会。</text>
<rect x="38" y="485" width="510" height="205" rx="15" fill="#f4efdf" stroke="#ccd9cf"/>
<text x="60" y="526" class="title">如果卡在负荷与条件</text>
<text x="60" y="567" class="body">必要任务仍没有接上，或方式太耗精力</text>
<text x="60" y="600" class="body">先核时间、资源和真正需要完成的部分</text>
<text x="60" y="633" class="body">不把更高强度约会变成新的工作</text>
<rect x="572" y="485" width="510" height="205" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="594" y="526" class="title">如果条件改善仍不愿靠近</text>
<text x="594" y="567" class="body">再看偏好、旧伤与关系意愿的实际依据</text>
<text x="594" y="600" class="body">不只加大活动强度，不强制身体接触</text>
<text x="594" y="633" class="body">减负本身有价值，但不购买亲密</text>
<text x="38" y="740" class="body">疲惫 → 被要求立即热情 → 拒绝被解释为不爱 → 防御与协调成本增加。</text>
<text x="38" y="780" class="small">这条负担循环需要事实支持；真实减负与澄清解释可以共同阻断，不能平均归责。</text>
<text x="38" y="827" class="small">六个连接入口：亲密、欣赏、浪漫、支持、自主、共同方向。一次选相关的一两项。</text>
<text x="38" y="875" class="small">图15-1 · 基于本书机制框架；不规定每日频率，不以活动次数代替本人体验。</text>
</svg>