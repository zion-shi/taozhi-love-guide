<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">经历怎样改变下一次相处</title><desc id="desc">共同经历经过感受与解释影响行动，新的回应又会影响接下来的经历和解释。既有经验、工作压力、资源与权力条件共同影响这一过程。三种可能的个人变化是目标排序、对自己和关系的解释，以及能力与依赖。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3d716f"/></marker></defs>
<rect width="1120" height="650" rx="20" fill="#faf8f2"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d3c} .minor{fill:#526565} .line{fill:none;stroke:#3d716f;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text x="40" y="53" font-size="30" font-weight="600" text-anchor="start" class="">经历怎样改变下一次相处</text>
<rect x="40" y="85" width="1040" height="72" rx="14" fill="#f0eee5" stroke="#d9d5c7"/>
<text x="560" y="117" font-size="23" font-weight="500" text-anchor="middle" class="">既有经验、工作压力、资源与权力条件</text>
<text x="560" y="143" font-size="18" font-weight="400" text-anchor="middle" class="minor">这些条件会影响各环节；关系不是唯一原因。</text>
<path d="M155 158 V195" stroke="#a6b1aa" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="40" y="200" width="230" height="128" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="155" y="250" font-size="25" font-weight="600" text-anchor="middle" class="">共同经历</text>
<text x="155" y="291" font-size="19" font-weight="400" text-anchor="middle" class="minor">发生了什么</text>
<path d="M425 158 V195" stroke="#a6b1aa" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="310" y="200" width="230" height="128" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="425" y="250" font-size="25" font-weight="600" text-anchor="middle" class="">感受与解释</text>
<text x="425" y="291" font-size="19" font-weight="400" text-anchor="middle" class="minor">我怎样理解这件事</text>
<path d="M695 158 V195" stroke="#a6b1aa" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="580" y="200" width="230" height="128" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="695" y="250" font-size="25" font-weight="600" text-anchor="middle" class="">下一步行动</text>
<text x="695" y="291" font-size="19" font-weight="400" text-anchor="middle" class="minor">我表达、靠近或退缩</text>
<path d="M965 158 V195" stroke="#a6b1aa" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="850" y="200" width="230" height="128" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="965" y="250" font-size="25" font-weight="600" text-anchor="middle" class="">新的关系回应</text>
<text x="965" y="291" font-size="19" font-weight="400" text-anchor="middle" class="minor">对方怎样回应与行动</text>
<path d="M273 264 H299" class="line"/>
<path d="M543 264 H569" class="line"/>
<path d="M813 264 H839" class="line"/>
<path d="M965 329 V389 H155 V342" class="line"/>
<text x="560" y="424" font-size="22" font-weight="500" text-anchor="middle" class="">新的回应可能修正预期，也可能强化已有解释。</text>
<rect x="40" y="462" width="330" height="112" rx="14" fill="#fffdf7" stroke="#ded8ca"/>
<text x="205" y="505" font-size="23" font-weight="600" text-anchor="middle" class="">目标排序</text>
<text x="205" y="545" font-size="19" font-weight="400" text-anchor="middle" class="minor">什么变得更重要</text>
<rect x="395" y="462" width="330" height="112" rx="14" fill="#fffdf7" stroke="#ded8ca"/>
<text x="560" y="505" font-size="23" font-weight="600" text-anchor="middle" class="">对自己与关系的解释</text>
<text x="560" y="545" font-size="19" font-weight="400" text-anchor="middle" class="minor">什么可以期待或表达</text>
<rect x="750" y="462" width="330" height="112" rx="14" fill="#fffdf7" stroke="#ded8ca"/>
<text x="915" y="505" font-size="23" font-weight="600" text-anchor="middle" class="">能力与依赖</text>
<text x="915" y="545" font-size="19" font-weight="400" text-anchor="middle" class="minor">哪些行动机会增加或减少</text>
<text x="560" y="617" font-size="20" font-weight="400" text-anchor="middle" class="minor">影响路径不等于必然结果；看见循环，不等于双方平均归责。</text>
</svg>