<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc">
<title id="title">亲密循环与实际体验</title><desc id="desc">需要表达、回应落地、真实体验与反馈、下一步选择形成条件循环。是否继续靠近由双方实际意愿和体验决定；安全合作底座与幸福动力分别支持参与，不能彼此替代。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="975" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="53" font-size="29" font-weight="600">回应经过实际体验，才可能支持再次靠近</text>
<text x="38" y="90" class="body">这条循环需要双方有意愿、回应相称且投入可承担；不是投入越多，亲密就越多。</text>
<rect x="38" y="130" width="480" height="170" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="171" class="title">1 · 需要被表达和理解</text>
<text x="60" y="212" class="body">从具体经历、当下状态开始</text>
<text x="60" y="245" class="body">已经清楚的请求，不必反复盘问</text>
<text x="60" y="278" class="body">还不清楚时，简短确认即可</text>
<rect x="602" y="130" width="480" height="170" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="624" y="171" class="title">2 · 回应真正落地</text>
<text x="624" y="212" class="body">用合适方式帮助、倾听或共同高兴</text>
<text x="624" y="245" class="body">说明当前能承担的范围</text>
<text x="624" y="278" class="body">约定稍后继续，要看实际接续</text>
<rect x="602" y="360" width="480" height="170" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="624" y="401" class="title">3 · 实际体验与真实反馈</text>
<text x="624" y="442" class="body">有用、尚未满足或不舒服，都可说明</text>
<text x="624" y="475" class="body">感谢让人知道效果，不是服务付款</text>
<text x="624" y="508" class="body">不能靠付出替对方宣布已经满意</text>
<rect x="38" y="360" width="480" height="170" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="401" class="title">4 · 据体验选择下一步</text>
<text x="60" y="442" class="body">愿意时再次分享与靠近</text>
<text x="60" y="475" class="body">也可以调整安排、暂停或停止</text>
<text x="60" y="508" class="body">继续参与，才创造下一轮机会</text>
<path class="line" d="M524,215 H590"/><path class="line" d="M842,306 V348"/><path class="line" d="M596,445 H530"/><path class="line" d="M278,354 V312"/>
<text x="38" y="574" class="body">循环断点要分别看：需要含糊、方式错位、反馈缺席、容量不足，或已经不愿参与。</text>
<rect x="38" y="610" width="510" height="192" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="651" class="title">安全合作底座：比较敢参与</text>
<text x="60" y="692" class="body">能表达需要、讨论差异与拒绝</text>
<text x="60" y="725" class="body">不因不同意见遭到羞辱和惩罚</text>
<text x="60" y="758" class="body">不等于自动产生喜欢与愉悦</text>
<rect x="572" y="610" width="510" height="192" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="594" y="651" class="title">幸福动力：愿意再次靠近</text>
<text x="594" y="692" class="body">对具体人的偏爱与欣赏</text>
<text x="594" y="725" class="body">共同快乐、连接、意义和方向</text>
<text x="594" y="758" class="body">不能抵销持续伤害或自主剥夺</text>
<text x="38" y="847" class="body">两者相互支持，不能互相替代；真实反馈也可能使人决定不再继续。</text>
<text x="38" y="888" class="body">已有羞辱、勒索或现实危险，不要求受损方反复改善表达来完成循环。</text>
<text x="38" y="941" class="small">图7-1 · 本书的条件性机制框架；不表示确定的因果强度，也不是亲密投入评分。</text>
</svg>