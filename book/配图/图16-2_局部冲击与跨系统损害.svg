<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="title desc">
<title id="title">局部冲击与跨系统损害</title><desc id="desc">收入下降是已经发生的条件变化，其他后果需要看真实资源和行为。透明合作可以缓冲，隐瞒越权造成额外治理损害，未知另列。照护中断传播到收入需要具体依赖条件。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="930" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="51" class="title">同一项变化，不预设整个关系的结局</text>
<rect x="300" y="90" width="520" height="115" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="322" y="131" class="title">当期可用收入减少</text>
<text x="322" y="172" class="body">先核必要支付、真实资源和原约定</text>
<path class="line" d="M560,211 V244 H198 V276"/>
<path class="line" d="M560,244 V276"/>
<path class="line" d="M560,244 H922 V276"/>
<rect x="38" y="285" width="320" height="247" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="326" class="title">如实说明并实际调整</text>
<text x="60" y="367" class="body">调整未发生的可选计划</text>
<text x="60" y="399" class="body">核对真实资源与必要任务</text>
<text x="60" y="431" class="body">合作有表现，缺口仍另核</text>
<text x="60" y="463" class="body">措施有效才形成局部缓冲</text>
<rect x="400" y="285" width="320" height="247" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="422" y="326" class="title">隐瞒或越权已发生</text>
<text x="422" y="367" class="body">错误信息影响共同决定</text>
<text x="422" y="399" class="body">私改用途损害原有约定</text>
<text x="422" y="431" class="body">补回钱仍须回应行为后果</text>
<text x="422" y="463" class="body">感情恢复另看本人体验</text>
<rect x="762" y="285" width="320" height="247" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="784" y="326" class="title">其他领域尚未知</text>
<text x="784" y="367" class="body">没有事实，不写成已受损</text>
<text x="784" y="399" class="body">可能路径不等于已发生</text>
<text x="784" y="431" class="body">查真实时间、支持和负担</text>
<text x="784" y="463" class="body">不凭收入变化判整体崩溃</text>
<text x="38" y="574" class="small">以上可以分别判断或并存；资金短缺不替隐瞒免责，善意也不能填平资源缺口。</text>
<rect x="38" y="615" width="1044" height="205" rx="15" fill="#f4efdf" stroke="#ccd9cf"/>
<text x="60" y="656" class="title">一种需要事实支持的传播路径</text>
<text x="60" y="697" class="body">照护没有接上  →  必须到场者因此缺勤  →  收入或工作受到影响</text>
<text x="60" y="729" class="body">每一段都要核对：实际依赖、影响程度、可用余量、替代是否及时到位。</text>
<text x="60" y="761" class="body">接替及时发生，后续损害未必出现；不能把一条箭头当作已经发生的事实。</text>
<text x="38" y="865" class="body">隐瞒、羞辱或排除参与，也可直接伤害治理与信任，不必按固定顺序传导。</text>
<text x="38" y="910" class="small">图16-2 · 条件性机制图，不计算概率；事务、信任与感情分别观察。</text>
</svg>
