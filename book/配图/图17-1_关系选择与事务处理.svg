<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">关系选择与事务处理</title>
<desc id="desc">存在现实危险时优先保护并调整接触方式。关系意愿与既有事务分别判断：结束不需等待全部善后，处理事务也不恢复亲密权限。图中两栏不是先后步骤。</desc>
<rect width="1120" height="740" fill="#faf8f2"/>
<g font-family="PingFang SC, sans-serif" fill="#243a32">
<text x="40" y="55" font-size="32" font-weight="600">是否继续，和还要处理什么，是两个问题</text>
<text x="40" y="89" font-size="19" fill="#53645c">从任何阶段进入；下方两栏分别处理，不是先后步骤。</text>
<rect x="40" y="115" width="1040" height="110" rx="16" fill="#f5e6df"/>
<text x="64" y="151" font-size="23" font-weight="600" fill="#754538">有现实危险：先保护，并重新判断接触与交接方式</text>
<text x="64" y="185" font-size="20" fill="#754538">不要求当面对质、完整取证、试尽修复或先离开成功；可直接寻求独立支持。</text>
<rect x="40" y="250" width="500" height="377" rx="16" fill="#e9f1eb"/>
<rect x="580" y="250" width="500" height="377" rx="16" fill="#e9edf0"/>
<text x="64" y="292" font-size="25" font-weight="600">关系选择</text>
<text x="604" y="292" font-size="25" font-weight="600">既有事务</text>
<text x="64" y="339" font-size="21" font-weight="600">本人愿不愿继续？</text>
<text x="64" y="372" font-size="19">意愿、核心方向、实际运行分别看。</text>
<text x="64" y="424" font-size="21" font-weight="600">尚未决定</text>
<text x="64" y="456" font-size="19">可以辨认事实与意愿，说明重看条件。</text>
<text x="64" y="510" font-size="21" font-weight="600">已经不愿继续</text>
<text x="64" y="542" font-size="19">不需证明对方坏，或永无改善可能。</text>
<text x="64" y="576" font-size="19">表达方式须适合当前安全与接触条件。</text>
<text x="604" y="339" font-size="21" font-weight="600">责任依据是什么？</text>
<text x="604" y="372" font-size="19">具体承诺、共同参与和合理依赖。</text>
<text x="604" y="424" font-size="21" font-weight="600">实际进行到哪一步？</text>
<text x="604" y="456" font-size="19">已完成／已确认待做／仍有缺口。</text>
<text x="604" y="510" font-size="21" font-weight="600">怎样作有限安排？</text>
<text x="604" y="542" font-size="19">看当前能力、必要需要与可用支持。</text>
<text x="604" y="576" font-size="19">能力有限不抹去来源，也不保证一切。</text>
<text x="40" y="675" font-size="22" font-weight="600">善后未完，不自动延长恋人身份；接受帮助，不表示同意亲密。</text>
<text x="40" y="710" font-size="18" fill="#53645c">图17-1 · 理解关系选择与事务处理，不是退出资格或危险程度评分表。</text>
</g></svg>
