<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="925" viewBox="0 0 1120 925" role="img" aria-labelledby="title desc">
<title id="title">再生迹象与继续选择</title><desc id="desc">损害停止、必要功能恢复、新价值生成是不同观察，不是强制顺序。继续依据真实意愿、行动与条件，退出不需穷尽所有可能方案。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="925" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="51" class="title">再生看新的运行与体验，不只看关系还在</text>
<text x="38" y="92" class="body">不同起点分别处理：普通疲惫不等于侵害，平静也不证明伤害已经停止。</text>
<rect x="38" y="135" width="320" height="220" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="176" class="title">已有损害是否停止</text>
<text x="60" y="217" class="body">看具体行为和自主空间</text>
<text x="60" y="250" class="body">不是只有道歉与礼物</text>
<text x="60" y="283" class="body">不强迫有危险者共修</text>
<text x="60" y="316" class="body">未发生侵害不硬套止损</text>
<rect x="400" y="135" width="320" height="220" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="422" y="176" class="title">必要功能是否恢复</text>
<text x="422" y="217" class="body">任务确实有人接上</text>
<text x="422" y="250" class="body">权限与负担可承担</text>
<text x="422" y="283" class="body">本人能实际休息或选择</text>
<text x="422" y="316" class="body">事务改善不等于相爱</text>
<rect x="762" y="135" width="320" height="220" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="784" y="176" class="title">新价值是否生成</text>
<text x="784" y="217" class="body">双方有主动与适当回应</text>
<text x="784" y="250" class="body">普通相处有认可的体验</text>
<text x="784" y="283" class="body">多次自然事实提供依据</text>
<text x="784" y="316" class="body">不要求重演初识强度</text>
<text x="38" y="401" class="small">三处分别观察，不是依次通过的三关；积极体验不抵销未处理责任。</text>
<rect x="38" y="445" width="510" height="215" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="486" class="title">支持当前继续尝试的依据</text>
<text x="60" y="527" class="body">双方仍愿意，并有可执行的安排</text>
<text x="60" y="560" class="body">真实行动带来可承担的改善</text>
<text x="60" y="593" class="body">新的连接得到本人认可</text>
<text x="60" y="626" class="body">未来条件仍保留限制与重看</text>
<rect x="572" y="445" width="510" height="215" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="594" y="486" class="title">需要调整或停止的事实</text>
<text x="594" y="527" class="body">关键条件仍未知：暂缓相关新绑定</text>
<text x="594" y="560" class="body">方案无效：换真实可行的处理位置</text>
<text x="594" y="593" class="body">本人不愿继续：承认选择，另办善后</text>
<text x="594" y="626" class="body">已有严重危险：保护不等待修复</text>
<text x="38" y="707" class="body">没有找到方案，不等于证明永无方案；看得到改善可能，也不要求任何人无限等待。</text>
<text x="38" y="751" class="small">新的可接受生活可以不同于从前；安全、自主与重要需要不能为保住关系而删去。</text>
<text x="38" y="799" class="small">具体行动与重大绑定分别判断：一次相处愉快不自动放行生育、购房或新负债。</text>
<text x="38" y="852" class="small">继续、调整与退出不是由总分替本人决定；本图不设统一恢复期限。</text>
<text x="38" y="899" class="small">图15-3 · 与A.2及I.4配合使用；必要时只回看眼前一项变化。</text>
</svg>