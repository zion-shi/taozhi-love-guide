<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="775" viewBox="0 0 1120 775" role="img" aria-labelledby="title desc"><title id="title">菱形演进模型</title><desc id="desc">两条观察轴为吸引与责任、体验与经营。四端点可以同时得到支持，不用坐标和面积衡量幸福，不与四个功能系统一一对应。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3d716f"/></marker></defs><rect width="1120" height="775" rx="20" fill="#faf8f2"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#253d3c} .minor{fill:#526565}</style>
<text x="40" y="53" font-size="30" font-weight="600" text-anchor="start" class="">菱形演进模型：两条观察轴</text>
<text x="40" y="91" font-size="21" font-weight="400" text-anchor="start" class="minor">静态看当前重心，连续观察才谈演进。</text>
<path d="M560 219 L800 388 L560 558 L320 388 Z" fill="#f0f3eb" stroke="#aebfb2" stroke-width="2"/>
<path d="M560 219 V558 M320 388 H800" stroke="#759b8c" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="430" y="124" width="260" height="105" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="560.0" y="162" font-size="23" font-weight="600" text-anchor="middle" class="">吸引</text>
<text x="560.0" y="198" font-size="19" font-weight="400" text-anchor="middle" class="minor">愿意靠近的动力</text>
<rect x="60" y="335" width="260" height="105" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="190.0" y="373" font-size="23" font-weight="600" text-anchor="middle" class="">体验</text>
<text x="190.0" y="409" font-size="19" font-weight="400" text-anchor="middle" class="minor">相处实际带来的价值</text>
<rect x="800" y="335" width="260" height="105" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="930.0" y="373" font-size="23" font-weight="600" text-anchor="middle" class="">经营</text>
<text x="930.0" y="409" font-size="19" font-weight="400" text-anchor="middle" class="minor">组织、创造与调整</text>
<rect x="430" y="558" width="260" height="105" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="560.0" y="596" font-size="23" font-weight="600" text-anchor="middle" class="">责任</text>
<text x="560.0" y="632" font-size="19" font-weight="400" text-anchor="middle" class="minor">承接承诺与合理依赖</text>
<rect x="390" y="311" width="340" height="152" rx="14" fill="#fffdf7" stroke="#ded8ca"/>
<text x="560" y="356" font-size="25" font-weight="600" text-anchor="middle" class="">吸引—责任</text>
<text x="560" y="395" font-size="25" font-weight="600" text-anchor="middle" class="">体验—经营</text>
<text x="560" y="434" font-size="19" font-weight="400" text-anchor="middle" class="minor">观察重心，不作零和刻度</text>
<text x="560" y="716" font-size="21" font-weight="400" text-anchor="middle" class="">四端点可以同时较强；不设分数、坐标、面积或幸福排名。</text>
<text x="560" y="751" font-size="20" font-weight="400" text-anchor="middle" class="minor">它们不是感情、生活、经济、治理的四个别名。</text>
</svg>