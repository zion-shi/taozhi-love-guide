<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="825" viewBox="0 0 1120 825" role="img" aria-labelledby="title desc">
<title id="title">三种不同问题</title><desc id="desc">性忠诚询问一对一排他承诺是否被遵守，经营责任询问是否愿意面对持续差异，具体同意询问当下行为是否本人自愿。三条分别判断；守约与经营不购买身体同意，自主也不取消对方退出或真实善后的问题。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="825" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="51" class="title">三个问题分别回答，不能互相代答</text>
<rect x="38" y="95" width="320" height="295" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="136" class="title">性忠诚</text>
<text x="60" y="177" class="body">对象：一对一排他承诺</text>
<text x="60" y="210" class="body">要问：是否守约</text>
<text x="60" y="243" class="body">看实际约定和行为</text>
<text x="60" y="276" class="body">不从一次身体拒绝推断不忠</text>
<rect x="400" y="95" width="320" height="295" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="422" y="136" class="title">经营责任</text>
<text x="422" y="177" class="body">对象：持续需要与差异</text>
<text x="422" y="210" class="body">要问：是否愿意诚实面对</text>
<text x="422" y="243" class="body">看讨论、可行安排与行动</text>
<text x="422" y="276" class="body">不把身体行为定成履约次数</text>
<rect x="762" y="95" width="320" height="295" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="784" y="136" class="title">具体同意</text>
<text x="784" y="177" class="body">对象：当下具体身体行为</text>
<text x="784" y="210" class="body">要问：本人此刻是否自愿</text>
<text x="784" y="243" class="body">意愿具体、可随时撤回</text>
<text x="784" y="276" class="body">身份和过去接受不代替同意</text>
<text x="38" y="437" class="body">同一情境可以得到三个不同判断：</text>
<rect x="38" y="465" width="1044" height="123" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="506" class="title">当天不愿亲密，愿另找时间谈持续疏远；没有第三方违约事实</text>
<text x="60" y="547" class="body">不能判定不忠；后续看讨论是否实际发生；眼前的拒绝应被尊重。</text>
<rect x="38" y="623" width="1044" height="123" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="60" y="664" class="title">守约且愿意讨论，也可能仍有重大不相容</text>
<text x="60" y="705" class="body">双方均可拒绝身体行为，也可决定不再继续；真实善后不以再次亲密清偿。</text>
<text x="38" y="792" class="small">图10-2 · 一对一恋爱与婚后均不自动许可具体行为；不是关系质量评分表。</text>
</svg>