<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="905" viewBox="0 0 1120 905" role="img" aria-labelledby="title desc">
<title id="title">关键功能与真实接替</title><desc id="desc">比较正常管理且后备可用、交接缺口和主动阻断；从必要功能、时间、资料、权限及资源判断，不要求共享全部密码。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="905" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="52" class="title">平时谁操作，与需要时谁能接上，是两个问题</text>
<rect x="38" y="90" width="1044" height="120" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="131" class="title">先问当前必要任务</text>
<text x="60" y="172" class="body">什么必须何时完成？若原操作者不可用，记录、权限、资金和接替者是否确实可用？</text>
<rect x="38" y="250" width="320" height="260" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="291" class="title">管理且可接替</text>
<text x="60" y="332" class="body">知道应付与已付状态</text>
<text x="60" y="365" class="body">本人有正当可用权限</text>
<text x="60" y="398" class="body">资金及执行条件到位</text>
<text x="60" y="431" class="body">实际完成对应支付</text>
<text x="60" y="464" class="body">不因主要一人操作就判危险</text>
<rect x="400" y="250" width="320" height="260" rx="15" fill="#f4efdf" stroke="#ccd9cf"/>
<text x="422" y="291" class="title">交接存在缺口</text>
<text x="422" y="332" class="body">必要信息或权限不足</text>
<text x="422" y="365" class="body">原操作者短时不可用</text>
<text x="422" y="398" class="body">先核需完成的时点与缓冲</text>
<text x="422" y="431" class="body">查现有路径或补足交接</text>
<text x="422" y="464" class="body">不凭缺口直接推断恶意</text>
<rect x="762" y="250" width="320" height="260" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="784" y="291" class="title">主动阻断参与</text>
<text x="784" y="332" class="body">故意封锁共同必要信息</text>
<text x="784" y="365" class="body">生活费与服从相挂钩</text>
<text x="784" y="398" class="body">参与和自主已受到损害</text>
<text x="784" y="431" class="body">优先恢复保护与可用支持</text>
<text x="784" y="464" class="body">不以先共同修复为前提</text>
<text x="38" y="555" class="small">三栏不是按顺序升级的阶段；根据事实辨认，动机不明时不抢先填结论。</text>
<path class="line" d="M560,518 V590"/>
<rect x="38" y="605" width="1044" height="145" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="646" class="title">何时成为单点依赖</text>
<text x="60" y="687" class="body">关键人或渠道不可用，使必要功能在相关时间内失去执行路径，且缺少足够缓冲。</text>
<text x="60" y="720" class="body">纸上两名后备若依赖同一个缺失条件，并未增加可用路径；人人全能也不是要求。</text>
<text x="38" y="794" class="small">杜芸与邹原的交接例：先不清楚付款状态，后核现有记录与权限，实际接上，没有重复付款。</text>
<text x="38" y="834" class="small">已经发生的权利损害，与以后可能发生的现金或照护中断，分别处理。</text>
<text x="38" y="876" class="small">图14-4 · 不要求交出全部私人密码；已存在胁迫时，不等待所有潜在后果出现。</text>
</svg>