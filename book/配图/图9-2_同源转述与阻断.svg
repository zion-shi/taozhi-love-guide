<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1030" viewBox="0 0 1120 1030" role="img" aria-labelledby="title desc">
<title id="title">同源转述与阻断</title><desc id="desc">一份描述经母亲和亲属群传播形成多次批评，乙减少参与又被甲解释为不愿融入，可能形成增强回路。同源不等于内容虚假，减少接触不等于有错。关键事实、相关事务和独立支持应分开处理。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="1030" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="52" class="title">多人重复一个故事，不等于新增多份独立证据</text>
<text x="38" y="91" class="body">独立虚构情境：重复评价与参与收缩可能相互加强，不证明有意合谋。</text>
<rect x="38" y="132" width="320" height="155" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="173" class="title">甲描述一次分歧</text>
<text x="60" y="214" class="body">原事实与描述的完整程度</text>
<text x="60" y="247" class="body">仍需要相称核对</text>
<rect x="400" y="132" width="320" height="155" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="422" y="173" class="title">母亲接收并转述</text>
<text x="422" y="214" class="body">最初的信息来源未增加</text>
<text x="422" y="247" class="body">转述可能加入解释</text>
<rect x="762" y="132" width="320" height="155" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="784" y="173" class="title">亲属群反复传播</text>
<text x="784" y="214" class="body">传播范围扩大</text>
<text x="784" y="247" class="body">并非多次独立观察</text>
<rect x="762" y="370" width="320" height="155" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="784" y="411" class="title">多人分别批评乙</text>
<text x="784" y="452" class="body">意见形成现实压力</text>
<text x="784" y="485" class="body">须看具体内容与后果</text>
<rect x="400" y="370" width="320" height="155" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="422" y="411" class="title">乙减少参加聚会</text>
<text x="422" y="452" class="body">可能是在应对压力</text>
<text x="422" y="485" class="body">不能直接推出乙有错</text>
<rect x="38" y="370" width="320" height="155" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="60" y="411" class="title">甲再解释为不融入</text>
<text x="60" y="452" class="body">若继续广播这一解释</text>
<text x="60" y="485" class="body">可能加强原来的压力</text>
<path class="line" d="M365,209 H389"/><path class="line" d="M727,209 H751"/><path class="line" d="M922,295 V359"/><path class="line" d="M751,448 H731"/><path class="line" d="M389,448 H369"/><path class="line" d="M31,448 H18 V209 H29"/>
<text x="38" y="573" class="body">回路是有条件的；同源并不证明内容必假，不能用传播形态替代事件核对。</text>
<rect x="38" y="619" width="320" height="220" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="660" class="title">相称核对关键事实</text>
<text x="60" y="701" class="body">分开亲历、转述与评价</text>
<text x="60" y="734" class="body">补足相关信息后</text>
<text x="60" y="767" class="body">观察判断是否更新</text>
<text x="60" y="800" class="body">不要求向整个群公开隐私</text>
<rect x="400" y="619" width="320" height="220" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="422" y="660" class="title">收回具体事务的处理</text>
<text x="422" y="701" class="body">由直接相关者讨论安排</text>
<text x="422" y="734" class="body">照护、资金的真实条件</text>
<text x="422" y="767" class="body">分别纳入对应决定</text>
<text x="422" y="800" class="body">不把私人分歧变成动员</text>
<rect x="762" y="619" width="320" height="220" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="784" y="660" class="title">保留独立支持与表达</text>
<text x="784" y="701" class="body">不只依赖唯一转述者</text>
<text x="784" y="734" class="body">实际可用的联系另核</text>
<text x="784" y="767" class="body">本人仍可拒绝不当接触</text>
<text x="784" y="800" class="body">可信危险优先相称保护</text>
<text x="38" y="892" class="body">核对后仍持续羞辱或附加无关服从条件，不能再只当作误会。</text>
<text x="38" y="931" class="body">正常咨询与亲友支持仍有价值；限制损害传播，不是隔绝必要帮助。</text>
<text x="38" y="1001" class="small">图9-2 · 解释性反馈图；不作人格、动机诊断或成功率主张。</text>
</svg>