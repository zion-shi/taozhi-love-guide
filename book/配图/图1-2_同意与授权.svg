<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">身体同意与共同事务授权</title><desc id="desc">身体接触须当下具体自愿，撤回便停止。共同事务在明确且仍有效的授权范围内可以执行，边界不清须先澄清。新的重大行动或超范围事项须重新了解后果和独立确认。身份、过去同意及对共同后果的讨论不能代替身体同意。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3d716f"/></marker></defs>
<rect width="1120" height="660" rx="20" fill="#faf8f2"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d3c} .minor{fill:#526565} .line{fill:none;stroke:#3d716f;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text x="40" y="53" font-size="30" font-weight="600" text-anchor="start" class="">身体同意与共同事务授权</text>
<text x="40" y="91" font-size="22" font-weight="400" text-anchor="start" class="minor">先看决定的性质，再判断需要怎样确认。</text>
<rect x="40" y="130" width="330" height="254" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="205" y="179" font-size="25" font-weight="600" text-anchor="middle" class="">身体接触</text>
<text x="205" y="229" font-size="20" font-weight="400" text-anchor="middle" class="">此刻、具体、自愿</text>
<text x="205" y="276" font-size="20" font-weight="400" text-anchor="middle" class="">愿意一项，不自动同意下一项</text>
<text x="205" y="323" font-size="20" font-weight="400" text-anchor="middle" class="">可以随时撤回</text>
<path d="M205 387 V418" class="line"/>
<rect x="40" y="432" width="330" height="108" rx="14" fill="#fffdf7" stroke="#ded8ca"/>
<text x="205" y="473" font-size="19" font-weight="500" text-anchor="middle" class="">不愿意或撤回，就停止</text>
<text x="205" y="508" font-size="19" font-weight="500" text-anchor="middle" class="">不以过去同意代替当下意愿</text>
<rect x="395" y="130" width="330" height="254" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="560" y="179" font-size="25" font-weight="600" text-anchor="middle" class="">共同事务执行</text>
<text x="560" y="229" font-size="20" font-weight="400" text-anchor="middle" class="">已有明确且仍有效的授权</text>
<text x="560" y="276" font-size="20" font-weight="400" text-anchor="middle" class="">本次行动在约定范围内</text>
<text x="560" y="323" font-size="20" font-weight="400" text-anchor="middle" class="">边界不清，先澄清</text>
<path d="M560 387 V418" class="line"/>
<rect x="395" y="432" width="330" height="108" rx="14" fill="#fffdf7" stroke="#ded8ca"/>
<text x="560" y="473" font-size="19" font-weight="500" text-anchor="middle" class="">范围内可以依约执行</text>
<text x="560" y="508" font-size="19" font-weight="500" text-anchor="middle" class="">不必将每项日常事务重复审批</text>
<rect x="750" y="130" width="330" height="254" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="915" y="179" font-size="25" font-weight="600" text-anchor="middle" class="">新的重大行动</text>
<text x="915" y="229" font-size="20" font-weight="400" text-anchor="middle" class="">新增或扩大责任与后果</text>
<text x="915" y="276" font-size="20" font-weight="400" text-anchor="middle" class="">不属于已有授权范围</text>
<text x="915" y="323" font-size="20" font-weight="400" text-anchor="middle" class="">重新了解影响与可行安排</text>
<path d="M915 387 V418" class="line"/>
<rect x="750" y="432" width="330" height="108" rx="14" fill="#fffdf7" stroke="#ded8ca"/>
<text x="915" y="473" font-size="19" font-weight="500" text-anchor="middle" class="">需要相关本人重新确认</text>
<text x="915" y="508" font-size="19" font-weight="500" text-anchor="middle" class="">没有确认，不擅自新增责任</text>
<text x="560" y="588" font-size="23" font-weight="600" text-anchor="middle" class="">恋人或配偶身份，不能自动放行具体行动。</text>
<text x="560" y="624" font-size="20" font-weight="400" text-anchor="middle" class="minor">协商共同后果，不产生支配另一人身体的权利。</text>
</svg>