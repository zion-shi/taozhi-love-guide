<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="title desc">
<title id="title">财务自检的用途与边界</title><desc id="desc">FHS看常态结构，RRS看冲击承载。FCR与DTI有重叠，SR与MR用同一资金但不同成本基准；未知单列，重大责任单独处理，不提供综合总分。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="930" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="52" class="title">两种观察，帮助找问题与下一步</text>
<text x="38" y="91" class="body">数值先说明范围、时点和假设；它不直接给出婚恋资格。</text>
<rect x="38" y="130" width="510" height="240" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="171" class="title">FHS · 常态运行</text>
<text x="60" y="212" class="body">来源能否持续，是否依赖同一风险</text>
<text x="60" y="245" class="body">刚性支付和债务占多少空间</text>
<text x="60" y="278" class="body">生活成本能否调整，约定怎样执行</text>
<text x="60" y="311" class="body">本例：FCR 60%；DTI 10%</text>
<rect x="572" y="130" width="510" height="240" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="594" y="171" class="title">RRS · 冲击与重大责任</text>
<text x="594" y="212" class="body">可用储备，支出锁定与大额事项</text>
<text x="594" y="245" class="body">保障范围，重大承诺及应收质量</text>
<text x="594" y="278" class="body">本例：SR 5个月；MR 4个月</text>
<text x="594" y="311" class="body">未知责任单列，不能由其他良好项抵销</text>
<rect x="38" y="405" width="510" height="180" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="446" class="title">两比率不可相加</text>
<text x="60" y="487" class="body">FCR已含最低债务偿付</text>
<text x="60" y="520" class="body">60% ＋ 10% 不是70%的新负担</text>
<text x="60" y="553" class="body">比率不是维度得分</text>
<rect x="572" y="405" width="510" height="180" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="594" y="446" class="title">两种续航不可相加</text>
<text x="594" y="487" class="body">同一60000元，分别除以12000/15000</text>
<text x="594" y="520" class="body">5个月与4个月不是合计9个月</text>
<text x="594" y="553" class="body">成本不变、无新收入或额外支出的演算</text>
<path class="line" d="M293,592 V628"/><path class="line" d="M827,592 V628"/>
<rect x="38" y="645" width="1044" height="145" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="686" class="title">共同回到具体行动</text>
<text x="60" y="727" class="body">补清与当前计划有关的事实，调整真实现金流或取得相应专业解释。</text>
<text x="60" y="760" class="body">七维与八维分别整理事实，重大责任单列；不合成总分，也不替本人作决定。</text>
<text x="38" y="834" class="small">示例采用60000元的测算时点；年内专款6000元不纳入，不能混用月底62000元。</text>
<text x="38" y="872" class="small">重大事实未清，可以暂缓受影响的新承诺；未知不直接等于零，也不直接等于危险。</text>
<text x="38" y="908" class="small">图14-3 · 与附录F.4—F.6同口径；未作发生概率、统一安全线或量表效度主张。</text>
</svg>