<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="970" viewBox="0 0 1120 970" role="img" aria-labelledby="title desc">
<title id="title">重大问题双坐标矩阵</title><desc id="desc">纵轴为对重要需要、正常生活和权利的持续影响；横轴为当前资源、意愿和条件下形成可持续共处方案的难度。四个区域提供问题，不自动决定去留；双方分别定位，不取平均，未知保留。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="970" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="52" class="title">先辨实际影响，再看当前能否形成可持续共处方案</text>
<text x="38" y="93" class="body">定位属于这个人、这个问题和这个时点；不是对议题或人格的统一评级。</text>
<text x="38" y="129" class="small">可信危险先转独立支持；不愿继续也不必先完成这张图。</text>
<path class="line" d="M190,650 V163"/><path class="line" d="M190,650 H1050"/>
<path d="M615,180 V630 M210,386 H1030" stroke="#d8d8c9" stroke-dasharray="6 7" fill="none"/>
<text x="132" y="187" class="small">较高</text>
<text x="132" y="633" class="small">较低</text>
<text x="38" y="340" class="title">持续影响</text>
<text x="38" y="378" class="small">重要需要与权利</text>
<text x="38" y="408" class="small">正常生活的负担</text>
<text x="38" y="454" class="small">不以情绪强弱</text>
<text x="38" y="484" class="small">替代影响判断</text>
<rect x="220" y="209" width="360" height="146" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="242" y="250" class="title">影响较高，路径仍可探索</text>
<text x="242" y="291" class="body">需要落实哪项实际改变？</text>
<text x="242" y="324" class="body">哪些负担仍未被处理？</text>
<rect x="650" y="209" width="360" height="146" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="672" y="250" class="title">影响较高，当前更难共处</text>
<text x="672" y="291" class="body">核心选择是否已有明确分歧？</text>
<text x="672" y="324" class="body">什么条件须改变，谁愿改变？</text>
<rect x="220" y="433" width="360" height="146" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="242" y="474" class="title">影响较低，安排可以简化</text>
<text x="242" y="515" class="body">是否需要一个轻量调整？</text>
<text x="242" y="548" class="body">已自然解决，是否可关闭？</text>
<rect x="650" y="433" width="360" height="146" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="672" y="474" class="title">影响较低，调整仍有约束</text>
<text x="672" y="515" class="body">当前约束究竟来自哪里？</text>
<text x="672" y="548" class="body">实际可接受的共处方式是什么？</text>
<text x="214" y="684" class="small">较低</text>
<text x="588" y="684" class="small">中间</text>
<text x="976" y="684" class="small">较高</text>
<text x="344" y="725" class="title">形成可持续共处方案的难度</text>
<rect x="38" y="760" width="1044" height="146" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="801" class="title">分别定位，再据新事实回看</text>
<text x="60" y="842" class="body">两人的位置不取平均；未知可以暂不定位，高低位置不自动命令分手或留下。</text>
<text x="60" y="875" class="body">自由接纳、资源或意愿变化若形成可持续方案，原来的难度判断也应更新。</text>
<text x="38" y="947" class="small">图I-1 · 描述性坐标，无数值门槛；与六步记录页一起使用，不替代本人选择。</text>
</svg>