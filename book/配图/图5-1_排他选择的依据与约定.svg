<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">排他的运行依据与共同约定</title><desc id="desc">双向生成支持提议，有限范围需说清；双方明确接受使约定成立，未共同接受可以开放了解或结束。排他不证明正式恋爱或许可具体行动。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="850" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="53" font-size="29" font-weight="600">有双向基础，再作双方真实愿意的选择</text>
<text x="38" y="90" class="body">运行依据与共同同意分别判断；不按次数、月份、礼物或身体经历升级。</text>
<rect x="38" y="124" width="450" height="180" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="165" class="title">已经有怎样的双向生成</text>
<text x="60" y="206" class="body">双方主动创造接触</text>
<text x="60" y="239" class="body">反复出现兴趣、关心与再次靠近</text>
<text x="60" y="272" class="body">看具体参与，不只看礼貌回复</text>
<rect x="570" y="124" width="512" height="180" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="592" y="165" class="title">把有限提议说清</text>
<text x="592" y="206" class="body">不与第三方发展浪漫或性关系</text>
<text x="592" y="239" class="body">合理优先接触、认真探索</text>
<text x="592" y="272" class="body">说明冲突性承诺及意愿变化告知</text>
<path class="line" d="M493,216 H562"/>
<text x="498" y="197" class="small">支持</text>
<path class="line" d="M826,308 V332 H560 V351"/>
<rect x="270" y="360" width="580" height="90" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="292" y="401" class="title">双方是否清楚接受这个范围？</text>
<path d="M560,453 V476 M293,476 H827" fill="none" stroke="#50746b" stroke-width="2"/><path class="line" d="M293,476 V493"/><path class="line" d="M827,476 V493"/>
<rect x="38" y="503" width="510" height="157" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="544" class="title">双方已明确接受</text>
<text x="60" y="585" class="body">有限排他约定成立</text>
<text x="60" y="618" class="body">按实际范围参与；意愿改变清楚告知</text>
<rect x="572" y="503" width="510" height="157" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="594" y="544" class="title">尚未共同接受</text>
<text x="594" y="585" class="body">可以继续双方愿意的开放了解，或结束</text>
<text x="594" y="618" class="body">单方收敛、已有投入不能代替同意</text>
<text x="38" y="708" class="body">排他之后仍需继续了解：普通投入的负担、积极价值、持续参与及必要事实。</text>
<text x="38" y="746" class="body">本节点不自动确认正式恋爱、适婚、身体许可、同居或共同财务安排。</text>
<text x="38" y="810" class="small">图5-1 · 本书的选择框架；已有运行支持是否适宜提议，明确接受使约定成立。</text>
</svg>