<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
<title id="title">任务变化与跨系统影响</title><desc id="desc">这次旅行中，未获同意的预订变更已增加住宿费用、协调负担并使参与感受损。图中从这一实际起点比较两种假设后续：主动补救，或持续隐瞒并否认参与。两条分支不表示都已发生。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="1000" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="51" class="title">同一件事影响不同领域，处置也要分别落地</text>
<rect x="38" y="88" width="1044" height="122" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="129" class="title">这次旅行已发生：住宿超出原约定，变更后才告知</text>
<text x="60" y="170" class="body">原款已退，新款已付；住宿从600元变为800元，未获事先同意。</text>
<path class="line" d="M198,217 V250"/><path class="line" d="M560,217 V250"/><path class="line" d="M922,217 V250"/>
<rect x="38" y="265" width="320" height="158" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="306" class="title">经济：差额已发生</text>
<text x="60" y="347" class="body">增加200元住宿费用</text>
<text x="60" y="380" class="body">不把已退原款重复算损失</text>
<rect x="400" y="265" width="320" height="158" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="422" y="306" class="title">生活：负担已增加</text>
<text x="422" y="347" class="body">需要额外核对与讨论</text>
<text x="422" y="380" class="body">负担转移不等于已经消失</text>
<rect x="762" y="265" width="320" height="158" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="784" y="306" class="title">治理与体验：已有反应</text>
<text x="784" y="347" class="body">先变更后告知剥夺参与</text>
<text x="784" y="380" class="body">许青表达被忽略的感受</text>
<text x="38" y="466" class="small">从同一起点比较两种假设后续；实际走向与进一步后果，仍须按新事实判断。</text>
<rect x="38" y="505" width="510" height="238" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="546" class="title">A · 说明、承认与实际补救</text>
<text x="60" y="587" class="body">主动说清差额，尊重对方的拒绝</text>
<text x="60" y="620" class="body">承担费用，恢复共同选择与授权</text>
<text x="60" y="653" class="body">后续自然变化中实际遵守约定</text>
<text x="60" y="686" class="body">提供有限改善证据，仍不保证适婚</text>
<rect x="572" y="505" width="510" height="238" rx="15" fill="#f5e8df" stroke="#ccd9cf"/>
<text x="594" y="546" class="title">B · 若持续隐瞒并否认参与</text>
<text x="594" y="587" class="body">真实条件继续被遮蔽</text>
<text x="594" y="620" class="body">以执行权否认另一人的决定资格</text>
<text x="594" y="653" class="body">可能进一步损伤信任与亲近意愿</text>
<text x="594" y="686" class="body">按实际严重性缩小暴露并寻求支持</text>
<text x="38" y="787" class="body">传导有条件：及时说明、真实补位或减少任务，可以阻断进一步扩散。</text>
<rect x="38" y="817" width="1044" height="116" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="60" y="858" class="title">分别处理真实受损处</text>
<text x="60" y="899" class="body">经济核对费用；生活减轻额外负担；治理恢复参与；感情看真实意愿与新体验。</text>
<text x="38" y="976" class="small">图8-3 · 这次经历未证实长期越权或全面感情崩溃；可信危险不要求先完成普通修复。</text>
</svg>