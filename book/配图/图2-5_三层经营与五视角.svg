<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="735" viewBox="0 0 1120 735" role="img" aria-labelledby="title desc"><title id="title">三层经营与五个观察视角</title><desc id="desc">三层经营是经营意愿、角色分工和协商机制，分别回答愿不愿参与、如何落实和怎样调整。五个观察视角为意愿、意识、能力、资本、风险，按具体问题检查行动条件。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3d716f"/></marker></defs><rect width="1120" height="735" rx="20" fill="#faf8f2"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#253d3c} .minor{fill:#526565}</style>
<text x="40" y="53" font-size="30" font-weight="600" text-anchor="start" class="">三层经营与五个观察视角</text>
<text x="40" y="100" font-size="23" font-weight="600" text-anchor="start" class="">先看合作怎样组织</text>
<rect x="40" y="125" width="320" height="152" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="200.0" y="163" font-size="23" font-weight="600" text-anchor="middle" class="">经营意愿</text>
<text x="200.0" y="199" font-size="19" font-weight="400" text-anchor="middle" class="minor">愿意参与什么</text>
<text x="200.0" y="229" font-size="19" font-weight="400" text-anchor="middle" class="minor">当前能承担什么</text>
<rect x="400" y="125" width="320" height="152" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="560.0" y="163" font-size="23" font-weight="600" text-anchor="middle" class="">角色分工</text>
<text x="560.0" y="199" font-size="19" font-weight="400" text-anchor="middle" class="minor">任务、责任和权限</text>
<text x="560.0" y="229" font-size="19" font-weight="400" text-anchor="middle" class="minor">落实到具体的人</text>
<rect x="760" y="125" width="320" height="152" rx="14" fill="#e9f1eb" stroke="#bbcdc2"/>
<text x="920.0" y="163" font-size="23" font-weight="600" text-anchor="middle" class="">协商机制</text>
<text x="920.0" y="199" font-size="19" font-weight="400" text-anchor="middle" class="minor">条件变化后</text>
<text x="920.0" y="229" font-size="19" font-weight="400" text-anchor="middle" class="minor">能够重新讨论与调整</text>
<path d="M368 201 H388" fill="none" stroke="#3d716f" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M728 201 H748" fill="none" stroke="#3d716f" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="560" y="332" font-size="23" font-weight="500" text-anchor="middle" class="">出现落空任务，再查与当前问题有关的行动条件。</text>
<rect x="40" y="385" width="192" height="190" rx="14" fill="#fffdf7" stroke="#bbcdc2"/>
<text x="136.0" y="423" font-size="23" font-weight="600" text-anchor="middle" class="">意愿</text>
<text x="136.0" y="459" font-size="19" font-weight="400" text-anchor="middle" class="minor">愿不愿认领</text>
<text x="136.0" y="489" font-size="19" font-weight="400" text-anchor="middle" class="minor">是否真实选择</text>
<rect x="252" y="385" width="192" height="190" rx="14" fill="#fffdf7" stroke="#bbcdc2"/>
<text x="348.0" y="423" font-size="23" font-weight="600" text-anchor="middle" class="">意识</text>
<text x="348.0" y="459" font-size="19" font-weight="400" text-anchor="middle" class="minor">是否知道需要</text>
<text x="348.0" y="489" font-size="19" font-weight="400" text-anchor="middle" class="minor">理解任务与责任</text>
<rect x="464" y="385" width="192" height="190" rx="14" fill="#fffdf7" stroke="#bbcdc2"/>
<text x="560.0" y="423" font-size="23" font-weight="600" text-anchor="middle" class="">能力</text>
<text x="560.0" y="459" font-size="19" font-weight="400" text-anchor="middle" class="minor">能否具体执行</text>
<text x="560.0" y="489" font-size="19" font-weight="400" text-anchor="middle" class="minor">需要怎样学习</text>
<rect x="676" y="385" width="192" height="190" rx="14" fill="#fffdf7" stroke="#bbcdc2"/>
<text x="772.0" y="423" font-size="23" font-weight="600" text-anchor="middle" class="">资本</text>
<text x="772.0" y="459" font-size="19" font-weight="400" text-anchor="middle" class="minor">时间、体力、费用</text>
<text x="772.0" y="489" font-size="19" font-weight="400" text-anchor="middle" class="minor">信息及社会资源</text>
<text x="772.0" y="519" font-size="19" font-weight="400" text-anchor="middle" class="minor">可用情绪余量</text>
<rect x="888" y="385" width="192" height="190" rx="14" fill="#fffdf7" stroke="#bbcdc2"/>
<text x="984.0" y="423" font-size="23" font-weight="600" text-anchor="middle" class="">风险</text>
<text x="984.0" y="459" font-size="19" font-weight="400" text-anchor="middle" class="minor">当前暴露与义务</text>
<text x="984.0" y="489" font-size="19" font-weight="400" text-anchor="middle" class="minor">谁承担后果</text>
<text x="984.0" y="519" font-size="19" font-weight="400" text-anchor="middle" class="minor">有无可用替代</text>
<text x="560" y="625" font-size="21" font-weight="400" text-anchor="middle" class="">同样未完成，可以需要不同补救；权限在责任与执行中核查。</text>
<text x="560" y="672" font-size="21" font-weight="400" text-anchor="middle" class="minor">四系统看领域，三层看组织，五视角看条件；不叠成多套考试。</text>
<text x="560" y="711" font-size="20" font-weight="400" text-anchor="middle" class="minor">方法也要照顾有限精力，避免把一人变成永久监督者。</text>
</svg>