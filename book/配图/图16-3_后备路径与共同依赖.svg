<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc">
<title id="title">后备路径与共同依赖</title><desc id="desc">祖母到家照护和送到祖母家照护都依赖同一个人，不是两份独立人力。不同后备还需核对时段能力意愿权限费用和启用前空档。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="830" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="51" class="title">名字或地点不同，不代表后备已经独立</text>
<rect x="110" y="98" width="400" height="112" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="132" y="139" class="title">祖母到家照护</text>
<text x="132" y="180" class="body">上门、到达时间与范围须确认</text>
<rect x="610" y="98" width="400" height="112" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="632" y="139" class="title">送到祖母家照护</text>
<text x="632" y="180" class="body">接送、住所与本人意愿须确认</text>
<path class="line" d="M310,217 V252 H485 V287"/>
<path class="line" d="M810,217 V252 H635 V287"/>
<rect x="300" y="297" width="520" height="128" rx="15" fill="#f4efdf" stroke="#ccd9cf"/>
<text x="322" y="338" class="title">同一位祖母</text>
<text x="322" y="379" class="body">两个名称共享同一个人力条件</text>
<text x="322" y="411" class="body">本人不能参与时，两种方式都受影响</text>
<text x="38" y="469" class="body">这不是两份独立人力；第二种尚未确认时，也不能先记为现有支持。</text>
<text x="38" y="518" class="title">即使找到另一位人选，实际启用还要核对四方面：</text>
<rect x="38" y="549" width="246" height="175" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="590" class="title">时段与接续</text>
<text x="60" y="631" class="body">何时能来、能做多久</text>
<text x="60" y="663" class="body">启动前空档由谁承担</text>
<rect x="304" y="549" width="246" height="175" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="326" y="590" class="title">能力与信息</text>
<text x="326" y="631" class="body">能完成哪项必要任务</text>
<text x="326" y="663" class="body">资料是否能实际交接</text>
<rect x="570" y="549" width="246" height="175" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="592" y="590" class="title">意愿与权限</text>
<text x="592" y="631" class="body">本人真实接受的范围</text>
<text x="592" y="663" class="body">必要授权是否具备</text>
<rect x="836" y="549" width="246" height="175" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="858" y="590" class="title">费用与维护</text>
<text x="858" y="631" class="body">钱和协调时间能否用</text>
<text x="858" y="663" class="body">原有其他责任会否冲突</text>
<text x="38" y="765" class="small">不同人员也可能共用同一服务或交通条件；独立程度要看实际相关性。</text>
<text x="38" y="809" class="small">图16-3 · 核对可用路径，不要求人人全能或无限储备，也不保证备用一定启动。</text>
</svg>
