<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" role="img" aria-labelledby="title desc">
<title id="title">同一件事的三种使用深度</title>
<desc id="desc">以M.10育儿任务未真正交接为例，正文解释损害与责任，工具留下当前有用的事实和行动，研究提出可检验的连接与其他解释。三种用途可按需选，不构成资格进阶。</desc>
<rect width="1160" height="800" fill="#f6f5ef"/>
<g font-family="PingFang SC, sans-serif" fill="#263f38">
<text x="42" y="62" font-size="30" font-weight="600">同一件事，按需要选择使用深度</text>
<text x="42" y="102" font-size="19" fill="#617167">不是资格进阶 · 不要求每次都使用全部材料</text>
<rect x="42" y="137" width="1076" height="104" rx="12" fill="#e8eddf"/>
<text x="64" y="174" font-size="21" font-weight="600">共同事实：任务名义交给乙，组织与提醒仍落在甲身上</text>
<text x="64" y="211" font-size="19">甲少休息、工作材料推迟；疲劳被误读，交流减少。孩子一直有人照护。</text>
<rect x="42" y="274" width="340" height="304" rx="12" fill="#e1ece6"/>
<rect x="410" y="274" width="340" height="304" rx="12" fill="#ece8d9"/>
<rect x="778" y="274" width="340" height="304" rx="12" fill="#e5e9ec"/>
<text x="66" y="320" font-size="24" font-weight="600">正文：理解理由</text>
<text x="434" y="320" font-size="24" font-weight="600">工具：支持当下行动</text>
<text x="802" y="320" font-size="24" font-weight="600">研究：检验解释</text>
<g font-size="19">
<text x="66" y="369">谁实际承担了组织与补漏？</text>
<text x="66" y="408">负担怎样进入休息与互动？</text>
<text x="66" y="447">首晚仍漏项，次晚才完整履行。</text>
<text x="66" y="511" fill="#38685d">保留具体人的成本与未解部分</text>
<text x="434" y="369">当前需要时，用G.1看任务链。</text>
<text x="434" y="408">以后用M.11记实际变化。</text>
<text x="434" y="447">未执行、未知，不先填成结果。</text>
<text x="434" y="511" fill="#6b6441">不要求同时填表或每天复查</text>
<text x="802" y="369">有哪些依赖、延迟与替代解释？</text>
<text x="802" y="408">什么事实会削弱原来的解释？</text>
<text x="802" y="447">一次改善不提供普遍因果系数。</text>
<text x="802" y="511" fill="#526b79">符号不能补齐事实与验证</text>
</g>
<path d="M 212 594 V 623 H 948 V 594 M 580 594 V 623" stroke="#93a197" stroke-width="2" fill="none"/>
<text x="330" y="663" font-size="22" font-weight="600">三种用途，都回到当时可得的事实</text>
<text x="42" y="729" font-size="19">愿不愿意、能否承担、实际执行与后果分别看；没有公式替本人同意或决定留下。</text>
<text x="42" y="767" font-size="18" fill="#617167">图中只使用本例已发生内容，不把潜在传播画成必然崩溃。</text>
</g></svg>
