<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1095" viewBox="0 0 1120 1095" role="img" aria-labelledby="title desc">
<title id="title">七步修复与三层结果</title><desc id="desc">七步从安全稳定到真实执行与积极连接。结果分别观察事务、规则信任及共同体、感情，三层可以不同步。危险先保护，退出无需先走完七步。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="1095" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="50" class="title">七步帮助找到未完成的事，不代替真实修复</text>
<text x="38" y="89" class="body">小分歧可以自然处理；卡住时回到具体环节，现实危险先转独立支持。</text>
<rect x="38" y="125" width="655" height="105" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="166" class="title">1 · 安全与稳定条件</text>
<text x="60" y="207" class="body">有现实危险先保护；普通过载暂停并保留回谈。</text>
<path class="line" d="M365,234 V244"/>
<rect x="38" y="250" width="655" height="105" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="291" class="title">2 · 分别陈述并交换</text>
<text x="60" y="332" class="body">区分事实、感受、解释与期待，不强求动机一致。</text>
<path class="line" d="M365,359 V369"/>
<rect x="38" y="375" width="655" height="105" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="416" class="title">3 · 确认冲突结构</text>
<text x="60" y="457" class="body">四层分别定位；看见循环不等于平分责任。</text>
<path class="line" d="M365,484 V494"/>
<rect x="38" y="500" width="655" height="105" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="541" class="title">4 · 处理本次事件</text>
<text x="60" y="582" class="body">承认责任、处理损失与现实安排，允许不再继续。</text>
<path class="line" d="M365,609 V619"/>
<rect x="38" y="625" width="655" height="105" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="666" class="title">5 · 约定未来行为和责任</text>
<text x="60" y="707" class="body">说明改变、权限、资源及重谈条件，形成真实认领。</text>
<path class="line" d="M365,734 V744"/>
<rect x="38" y="750" width="655" height="105" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="791" class="title">6 · 执行观察</text>
<text x="60" y="832" class="body">看实际行动；新损害、未知和改善分别记录。</text>
<path class="line" d="M365,859 V869"/>
<rect x="38" y="875" width="655" height="105" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="916" class="title">7 · 重新创造积极连接</text>
<text x="60" y="957" class="body">双方愿意时恢复理解与共同快乐，不用亲密买断责任。</text>
<text x="742" y="112" class="small">从全过程分别观察三层结果</text>
<rect x="742" y="135" width="340" height="178" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="764" y="176" class="title">事务</text>
<text x="764" y="217" class="body">费用和实际安排是否处理</text>
<text x="764" y="250" class="body">必要任务是否完成</text>
<rect x="742" y="345" width="340" height="211" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="764" y="386" class="title">规则、信任与共同体</text>
<text x="764" y="427" class="body">是否恢复参与和可信约定</text>
<text x="764" y="460" class="body">本人是否仍认可共同方向</text>
<text x="764" y="493" class="body">后续行为提供多少支持</text>
<rect x="742" y="588" width="340" height="178" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="764" y="629" class="title">感情</text>
<text x="764" y="670" class="body">是否愿意重新靠近</text>
<text x="764" y="703" class="body">是否出现新的积极体验</text>
<rect x="742" y="798" width="340" height="180" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="764" y="839" class="title">恢复可以不同步</text>
<text x="764" y="880" class="body">补钱不等于信任已恢复</text>
<text x="764" y="913" class="body">一次执行不保证长期可靠</text>
<text x="764" y="946" class="body">不愿继续仍可处理善后</text>
<text x="38" y="1028" class="body">七步是可回看的过程；三层结果不是按步骤分别完成，也不由填表自动生成。</text>
<text x="38" y="1071" class="small">图8-2 · 与正文8.6和附录I.4使用同一流程；本书整合框架，不作验证效度主张。</text>
</svg>