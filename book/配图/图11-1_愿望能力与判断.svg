<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc">
<title id="title">愿望能力与判断</title><desc id="desc">八类价值说明想要的生活结果，六类组合能力说明实现路径，资源与权限支持行动。实际行动在感情生活经济治理四系统产生结果，静态现实动态三层回顾已有证据。各框架不机械对应，也不叠加为总分。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#50746b"/></marker></defs>
<rect width="1120" height="830" fill="#faf8f2"/>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#253d3c}.body{font-size:18px}.small{font-size:16px}.title{font-size:24px;font-weight:600}.line{fill:none;stroke:#50746b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="38" y="51" class="title">先说明所求，再看实现路径与已有依据</text>
<rect x="38" y="90" width="1044" height="125" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="131" class="title">八类价值：希望生活怎样变好</text>
<text x="60" y="172" class="body">描述普通一周里的真实需要；同一活动可以产生多种价值，但不能重复计分。</text>
<path class="line" d="M293,223 V248"/>
<rect x="38" y="260" width="510" height="170" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="301" class="title">六类组合能力：谁能怎样做</text>
<text x="60" y="342" class="body">互补、学习与外援可以组合</text>
<text x="60" y="375" class="body">会做、愿做、能协作、条件允许分别看</text>
<rect x="572" y="260" width="510" height="170" rx="15" fill="#fffdf8" stroke="#ccd9cf"/>
<text x="594" y="301" class="title">现实资源与权限：能调用什么</text>
<text x="594" y="342" class="body">资金、时间、支持与执行权限</text>
<text x="594" y="375" class="body">同一笔钱或同一时段不能重复使用</text>
<path class="line" d="M568,345 H554"/><path class="line" d="M293,438 V463"/><path class="line" d="M827,438 V463"/>
<rect x="38" y="475" width="1044" height="145" rx="15" fill="#e9f1eb" stroke="#ccd9cf"/>
<text x="60" y="516" class="title">在感情、生活、经济、治理四系统中实际运行</text>
<text x="60" y="557" class="body">看行动形成了什么结果，谁真实受益，成本与负担落在谁身上。</text>
<text x="60" y="590" class="body">资源能够支持行动，却不自动产生亲近、合作或双方意愿。</text>
<path class="line" d="M560,628 V653"/>
<rect x="38" y="665" width="1044" height="110" rx="15" fill="#eef0e7" stroke="#ccd9cf"/>
<text x="60" y="706" class="title">静态、现实、动态三层回顾：哪些已有依据，哪些仍未实现</text>
<text x="60" y="747" class="body">新事实可以改变愿望、实现路径或当前选择，不是填满清单就通过。</text>
<text x="38" y="811" class="small">图11-1 · 框架各有用途；五视角用于辨认具体缺口，不另加总分。</text>
</svg>